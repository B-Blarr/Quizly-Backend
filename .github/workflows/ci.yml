name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Checks the pinned packages against the public vulnerability databases.
  # The pins are exact, so no install and no resolving is needed, which also
  # keeps torch and Whisper out of this job.
  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements
        run: pip-audit -r requirements.txt --no-deps --disable-pip
